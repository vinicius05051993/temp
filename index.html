<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda | Portal Maple Bear Brasil</title>
<link rel="stylesheet" href="agenda.css">

</head>
<body>
<main>

<div class="main-layout">
<section class="calendar-shell">
  <div class="toolbar">
    <div class="month-controls">
      <button class="today-btn" id="today">Hoje</button>
      <button class="nav-btn" id="prev" aria-label="Mês anterior">‹</button>
      <button class="nav-btn" id="next" aria-label="Próximo mês">›</button>
      <div class="month-title" id="month-title"></div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#d71920"></i>Convenção</span>
      <span><i class="dot" style="background:#2f6fbd"></i>Webinar</span>
      <span><i class="dot" style="background:#27834a"></i>Treinamento</span>
      <span><i class="dot" style="background:#7856a8"></i>Outros</span>
    </div>
  </div>
  <div class="calendar-grid" id="calendar">
    <div class="weekday">DOM</div><div class="weekday">SEG</div><div class="weekday">TER</div>
    <div class="weekday">QUA</div><div class="weekday">QUI</div><div class="weekday">SEX</div><div class="weekday">SÁB</div>
  </div>
</section>
<aside class="panel upcoming-panel">
  <h2>Próximos eventos</h2>
  <div id="upcoming" class="event-list"></div>
  <p class="hint">Clique em um evento para abrir seus detalhes.</p>
</aside>
</div>
</main>
<div class="modal-backdrop" id="event-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
 <div class="modal">
  <div class="modal-header"><h2 id="modal-title">Detalhes do evento</h2><button class="modal-close" id="modal-close" aria-label="Fechar">&times;</button></div>
  <div class="modal-body" id="modal-content"></div>
  <div class="modal-footer" id="modal-actions"></div>
 </div>
</div>
<footer>Portal Maple Bear Brasil</footer>

<script src="agenda.js" defer></script>
</body>
</html>
